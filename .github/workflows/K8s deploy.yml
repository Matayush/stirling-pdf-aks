name: 'K8s Deploy'

concurrency:
  group: k8s-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches: [main, test]
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options: [test, main]

permissions:
  contents: read

env:
  ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID }}"
  ARM_CLIENT_SECRET: "${{ secrets.ARM_CLIENT_SECRET }}"
  ARM_TENANT_ID: "${{ secrets.ARM_TENANT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.ARM_SUBSCRIPTION_ID }}"

jobs:
  import-images:
    name: 'Import Images to ACR'
    runs-on: ubuntu-latest

    steps:
    - name: Set environment
      id: env
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "environment=prod"                 >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-prod" >> $GITHUB_OUTPUT
          echo "acr_name=acrstirlingprod"        >> $GITHUB_OUTPUT
          echo "cluster_name=aks-prod"           >> $GITHUB_OUTPUT
        else
          echo "environment=test"                 >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-test" >> $GITHUB_OUTPUT
          echo "acr_name=acrstirlingtest"        >> $GITHUB_OUTPUT
          echo "cluster_name=aks-test"           >> $GITHUB_OUTPUT
        fi

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

    - name: Import Stirling-PDF image to ACR
      run: |
        az acr import \
          --name "${{ steps.env.outputs.acr_name }}" \
          --source docker.io/stirlingtools/stirling-pdf:latest \
          --image stirling-pdf:latest \
          --resource-group "${{ steps.env.outputs.resource_group }}" \
          --force
        echo "✅ Imported stirling-pdf:latest to ${{ steps.env.outputs.acr_name }}.azurecr.io"

    - name: Verify image in ACR
      run: |
        az acr repository show-tags \
          --name "${{ steps.env.outputs.acr_name }}" \
          --repository stirling-pdf \
          --output table

  k8s-deploy:
    name: 'Deploy to AKS'
    needs: [import-images]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'test' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set environment
      id: env
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "environment=prod"                 >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-prod" >> $GITHUB_OUTPUT
          echo "cluster_name=aks-prod"           >> $GITHUB_OUTPUT
        else
          echo "environment=test"                 >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-test" >> $GITHUB_OUTPUT
          echo "cluster_name=aks-test"           >> $GITHUB_OUTPUT
        fi

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

    - name: Get Runner IP
      id: runner-ip
      run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

    - name: Whitelist Runner IP on AKS API Server
      run: |
        AKS_EXISTS=$(az aks show \
          --name "${{ steps.env.outputs.cluster_name }}" \
          --resource-group "${{ steps.env.outputs.resource_group }}" \
          --query "name" -o tsv 2>/dev/null || echo "")

        if [ "$AKS_EXISTS" != "" ]; then
          echo "AKS exists — whitelisting runner IP..."
          CURRENT_IPS=$(az aks show \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --resource-group "${{ steps.env.outputs.resource_group }}" \
            --query "apiServerAccessProfile.authorizedIpRanges" \
            -o tsv | tr '\n' ',' | sed 's/,$//')
          echo "previous_ips=${CURRENT_IPS}" >> $GITHUB_ENV

          az aks update \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --resource-group "${{ steps.env.outputs.resource_group }}" \
            --api-server-authorized-ip-ranges "${CURRENT_IPS:+${CURRENT_IPS},}${{ steps.runner-ip.outputs.ip }}/32"

          az aks wait \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --resource-group "${{ steps.env.outputs.resource_group }}" \
            --updated
        else
          echo "AKS does not exist yet — skipping whitelist"
        fi

    - name: Debug — Confirm Runner IP Whitelisted on AKS
      run: |
        echo "Runner IP: ${{ steps.runner-ip.outputs.ip }}"
        AKS_EXISTS=$(az aks show \
          --name "${{ steps.env.outputs.cluster_name }}" \
          --resource-group "${{ steps.env.outputs.resource_group }}" \
          --query "name" -o tsv 2>/dev/null || echo "")

        if [ -n "$AKS_EXISTS" ]; then
          echo "Current AKS authorized IP ranges:"
          az aks show \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --resource-group "${{ steps.env.outputs.resource_group }}" \
            --query "apiServerAccessProfile.authorizedIpRanges" \
            -o tsv
        fi

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ steps.env.outputs.resource_group }}
        cluster-name: ${{ steps.env.outputs.cluster_name }}

    - name: Deploy manifests
      uses: azure/k8s-deploy@v4
      with:
        namespace: stirling-pdf
        manifests: |
          k8s/namespace.yaml
          k8s/configmap-backend.yaml
          k8s/configmap-frontend.yaml
          k8s/deployment-backend.yaml
          k8s/deployment-frontend.yaml
          k8s/service-backend.yaml
          k8s/service-frontend.yaml
          k8s/hpa-backend.yaml
          k8s/hpa-frontend.yaml

    - name: Remove Runner IP from AKS API Server
      if: always()
      run: |
        AKS_EXISTS=$(az aks show \
          --name "${{ steps.env.outputs.cluster_name }}" \
          --resource-group "${{ steps.env.outputs.resource_group }}" \
          --query "name" -o tsv 2>/dev/null || echo "")

        if [ "$AKS_EXISTS" != "" ]; then
          RESTORE="${previous_ips}"
          if [ -z "$RESTORE" ]; then
            echo "previous_ips is empty — skipping to avoid wiping all IPs"
            exit 0
          fi
          echo "Restoring AKS IP ranges to: $RESTORE"
          az aks update \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --resource-group "${{ steps.env.outputs.resource_group }}" \
            --api-server-authorized-ip-ranges "$RESTORE"
        else
          echo "AKS does not exist — nothing to clean up"
        fi
