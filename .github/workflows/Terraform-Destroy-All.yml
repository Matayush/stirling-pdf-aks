name: 'Terraform Destroy'

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev or test — never prod here!)'
        required: true
        type: choice
        options:
          - dev
          - test
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  contents: read

env:
  ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID }}"
  ARM_CLIENT_SECRET: "${{ secrets.ARM_CLIENT_SECRET }}"
  ARM_TENANT_ID: "${{ secrets.ARM_TENANT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.ARM_SUBSCRIPTION_ID }}"

jobs:
  terraform-destroy-plan:
    name: 'Terraform Destroy Plan'
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    outputs:
      tfplanExitCode: ${{ steps.tf-destroy-plan.outputs.exitcode }}
      backendKey: ${{ steps.backend.outputs.key }}
      environment: ${{ steps.backend.outputs.environment }}
      resource_group: ${{ steps.backend.outputs.resource_group }}
      kv_name: ${{ steps.backend.outputs.kv_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # Mirrors your plan/apply workflow — resource group hardcoded per environment
    # to avoid relying on shared repo vars that could point to the wrong environment
    - name: Set backend key and environment
      id: backend
      run: |
        if [[ "${{ github.ref_name }}" == "dev" ]]; then
          echo "key=stirling-pdf-dev.tfstate" >> $GITHUB_OUTPUT  
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-dev" >> $GITHUB_OUTPUT
          echo "kv_name=kv-stirlingdev" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "test" ]]; then 
          echo "key=stirling-pdf-test.tfstate" >> $GITHUB_OUTPUT 
          echo "environment=test" >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-test" >> $GITHUB_OUTPUT
          echo "kv_name=kv-stirlingtest" >> $GITHUB_OUTPUT
        else 
          echo "key=stirling-pdf-prod.tfstate" >> $GITHUB_OUTPUT 
          echo "environment=prod" >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-prod" >> $GITHUB_OUTPUT
          echo "kv_name=kv-stirlingprod" >> $GITHUB_OUTPUT
        fi

    - name: Terraform Init
      run: terraform init -backend-config="key=${{ steps.backend.outputs.key }}"

    - name: Azure Login
      uses:  azure/login@v2
      with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

    - name: Get Runner IP
      id: runner-ip
      run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

    # Temporarily whitelist the GitHub Actions runner IP on the Key Vault network ACL.
    - name: Whitelist Runner IP on Key Vault
      run: |
        KEYVAULT_NAME="${{ steps.backend.outputs.kv_name }}"
        RESOURCE_GROUP="${{ steps.backend.outputs.resource_group }}"

        if az keyvault show --name "$KEYVAULT_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Key Vault found — adding runner IP to network rules"
          az keyvault network-rule add \
            --name "$KEYVAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}"
        else
          echo "Key Vault does not exist yet — skipping (first deployment)"
        fi

    - name: Debug — Confirm Runner IP Was Whitelisted on Key Vault
      run: |
        KEYVAULT_NAME="${{ steps.backend.outputs.kv_name }}"
        RESOURCE_GROUP="${{ steps.backend.outputs.resource_group }}"

        echo "Runner IP: ${{ steps.runner-ip.outputs.ip }}"

        if az keyvault show --name "$KEYVAULT_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Current Key Vault allowed IP rules:"
            az keyvault network-rule list \
              --name "$KEYVAULT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "ipRules[].value" \
              -o tsv
        else
          echo "Key Vault does not exist yet — nothing to check (first deployment)"
        fi  

    # Validates the Terraform configuration files in the current directory.  
    - name: Terraform Validate         
      run: terraform validate  

    - name: Terraform Destroy Plan
      id: tf-destroy-plan
      run: |
        export exitcode=0
        terraform plan -destroy \
          -var="environment=${{ github.event.inputs.environment }}" \
          -var="location=${{ vars.location }}" \
          -var="resource_group_name=${{ steps.backend.outputs.resource_group }}" \
          -detailed-exitcode -no-color -out=tfdestroyplan || export exitcode=$?

        echo "exitcode=$exitcode" >> $GITHUB_OUTPUT

        if [ $exitcode -eq 1 ]; then
          echo Terraform Destroy Plan Failed!
          exit 1
        else
          exit 0
        fi

    # Save plan as artifact so apply job can download it
    - name: Publish Terraform Destroy Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfdestroyplan
        path: tfdestroyplan

    - name: Publish Destroy Plan to Summary
      run: |
        PLAN=$(terraform show -no-color tfdestroyplan)
        delimiter="$(openssl rand -hex 8)"
        echo "## 🔥 Destroy Plan for \`${{ github.event.inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>Click to expand</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```terraform' >> $GITHUB_STEP_SUMMARY
        echo "$PLAN" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY

  terraform-destroy-apply:
    name: 'Terraform Destroy Apply'
    # Only run if there are resources to destroy (exitcode 2 = changes pending)
    if: needs.terraform-destroy-plan.outputs.tfplanExitCode == '2'
    runs-on: ubuntu-latest
    # This triggers the GitHub Environment protection rule (manual reviewer approval)
    # before the destroy is executed — reviewer sees the plan summary first
    environment: ${{ github.event.inputs.environment }}
    needs: [terraform-destroy-plan]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend-config="key=${{ needs.terraform-destroy-plan.outputs.backendKey }}"

    - name: Azure Login
      uses:  azure/login@v2
      with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

    - name: Get Runner IP
      id: runner-ip
      run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

    # Temporarily whitelist the GitHub Actions runner IP on the Key Vault network ACL.
    - name: Whitelist Runner IP on Key Vault
      run: |
        KEYVAULT_NAME="${{ needs.terraform-destroy-plan.outputs.kv_name }}"
        RESOURCE_GROUP="${{ needs.terraform-destroy-plan.outputs.resource_group }}"

        if az keyvault show --name "$KEYVAULT_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Key Vault found — adding runner IP to network rules"
          az keyvault network-rule add \
            --name "$KEYVAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}"
        else
          echo "Key Vault does not exist yet — skipping (first deployment)"
        fi

    - name: Debug — Confirm Runner IP Was Whitelisted on Key Vault
      run: |
        KEYVAULT_NAME="${{ needs.terraform-destroy-plan.outputs.kv_name }}"
        RESOURCE_GROUP="${{ needs.terraform-destroy-plan.outputs.resource_group }}"

        echo "Runner IP: ${{ steps.runner-ip.outputs.ip }}"

        if az keyvault show --name "$KEYVAULT_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Current Key Vault allowed IP rules:"
            az keyvault network-rule list \
              --name "$KEYVAULT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "ipRules[].value" \
              -o tsv
        else
          echo "Key Vault does not exist yet — nothing to check (first deployment)"
        fi

    - name: Download Terraform Destroy Plan
      uses: actions/download-artifact@v4
      with:
        name: tfdestroyplan

    - name: Terraform Destroy Apply
      run: terraform apply -auto-approve tfdestroyplan
