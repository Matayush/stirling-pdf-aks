name: 'Terraform Plan/Apply'

# Concurrency ensures that only one workflow per branch (dev/test/main) runs at a time. 
# This prevents Terraform state lock conflicts, avoids parallel plan/apply collisions, 
# and automatically cancels older runs when new commits arrive on the same branch.
concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [dev, main, test]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [dev, main, test]
    paths:
      - '**.tf'
      - '.github/workflows/terraform.yml'
# Permissions required for Terraform CI/CD using a Service Principal.
permissions:
  contents: read
  pull-requests: write
  security-events: write

# Environment variables used by the AzureRM Terraform provider to authenticate using a Service Principal
env:
  ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID }}"
  ARM_CLIENT_SECRET: "${{ secrets.ARM_CLIENT_SECRET }}"
  ARM_TENANT_ID: "${{ secrets.ARM_TENANT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.ARM_SUBSCRIPTION_ID }}"
  TF_VAR_allowed_ips: ${{ vars.ALLOWED_IPS }}

jobs:
  # This custom exit-code handling is needed since the plan job runs with 
  # read-only permissions, allowing us to safely pass the results to the apply job.
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}
      environment: ${{ steps.env.outputs.environment }}
      resource_group: ${{ steps.env.outputs.resource_group }}
      kv_name: ${{ steps.env.outputs.kv_name }}
      tf_state_key: ${{ steps.env.outputs.tf_state_key }}
      cluster_name: ${{ steps.env.outputs.cluster_name }}
      acr_name: ${{ steps.env.outputs.acr_name }}
      namespace: ${{ steps.env.outputs.namespace }}
      overlay_path: ${{ steps.env.outputs.overlay_path }}
      cluster_path: ${{ steps.env.outputs.cluster_path }}
      deploy_enabled: ${{ steps.env.outputs.deploy_enabled }}


    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of the Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
        
    # Selects the correct Terraform state file based on the branch that triggered the workflow. 
    # This keeps dev, test, and prod environments isolated while using a single shared backend configuration. 
    - name: Set environment context
      id: env
      run: |
        if [[ "${{ github.ref_name }}" == "dev" ]]; then
          echo "tf_state_key=stirling-pdf-dev.tfstate" >> $GITHUB_OUTPUT  
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-dev" >> $GITHUB_OUTPUT
          echo "kv_name=kv-stirlingdev"        >> $GITHUB_OUTPUT
          echo "cluster_name=aks-dev"                 >> $GITHUB_OUTPUT
          echo "acr_name=acrstirlingdev" >> $GITHUB_OUTPUT
          echo "namespace"=stirling-pdf" >> $GITHUB_OUTPUT
          echo "overlay-path=k8s/apps/stirling-pdf/overlays/dev" >> $GITHUB_OUTPUT
          echo "cluster_path=k8s/clusters/aks-dev" >> $GITHUB_OUTPUT
          echo "deploy_enabled=false" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "test" ]]; then 
          echo "tf_state_key=stirling-pdf-test.tfstate" >> $GITHUB_OUTPUT 
          echo "environment=test" >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-test" >> $GITHUB_OUTPUT
          echo "kv_name=kv-stirlingtest"        >> $GITHUB_OUTPUT
          echo "cluster_name=aks-test"                 >> $GITHUB_OUTPUT
          echo "acr_name=acrstirlingtest" >> $GITHUB_OUTPUT
          echo "namespace"=stirling-pdf" >> $GITHUB_OUTPUT
          echo "overlay-path=k8s/apps/stirling-pdf/overlays/test" >> $GITHUB_OUTPUT
          echo "cluster_path=k8s/clusters/aks-test" >> $GITHUB_OUTPUT
          echo "deploy_enabled=true" >> $GITHUB_OUTPUT
        else 
          echo "tf_state_key=stirling-pdf-prod.tfstate" >> $GITHUB_OUTPUT 
          echo "environment=prod" >> $GITHUB_OUTPUT
          echo "resource_group=rg-stirling-prod" >> $GITHUB_OUTPUT
          echo "kv_name=kv-stirlingprod"        >> $GITHUB_OUTPUT
          echo "cluster_name=aks-prod"                 >> $GITHUB_OUTPUT
          echo "acr_name=acrstirlingprod" >> $GITHUB_OUTPUT
          echo "namespace"=stirling-pdf" >> $GITHUB_OUTPUT
          echo "overlay-path=k8s/apps/stirling-pdf/overlays/prod" >> $GITHUB_OUTPUT
          echo "cluster_path=k8s/clusters/aks-prod" >> $GITHUB_OUTPUT
          echo "deploy_enabled=true" >> $GITHUB_OUTPUT
        fi
        
    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init -backend-config="key=${{ steps.env.outputs.tf_state_key }}"

    - name: Azure Login
      uses:  azure/login@v2
      with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

    - name: Get Runner IP
      id: runner-ip
      run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

    # Temporarily whitelist the GitHub Actions runner IP on the Key Vault network ACL.
    - name: Whitelist Runner IP on Key Vault
      run: |
        KEYVAULT_NAME="${{ steps.env.outputs.kv_name }}"
        RESOURCE_GROUP="${{ steps.env.outputs.resource_group }}"

        if [ -n "$KEYVAULT_NAME" ] && az keyvault show --name "$KEYVAULT_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Key Vault found — adding runner IP to network rules"
          az keyvault network-rule add \
            --name "$KEYVAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}"
        else
          echo "Key Vault does not exist yet — skipping (first deployment)"
        fi

    # Validates the Terraform configuration files in the current directory.  
    - name: Terraform Validate         
      run: terraform validate

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    # An exit code of 0 indicated no changes, 1 a terraform failure, 2 there are pending changes.
    - name: Terraform Plan
      id: tf-plan
      run: |
        export exitcode=0
        terraform plan \
          -lock-timeout=5m \
          -var "environment=${{ steps.env.outputs.environment }}" \
          -var "location=${{ vars.location }}" \
          -var "resource_group_name=${{ steps.env.outputs.resource_group }}" \
          -detailed-exitcode -no-color -out tfplan || export exitcode=$?

        echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
        
        if [ $exitcode -eq 1 ]; then
          echo Terraform Plan Failed!
          exit 1
        else 
          exit 0
        fi

    # Create string output of Terraform Plan
    - name: Create String Output
      id: tf-plan-string
      run: |
        TERRAFORM_PLAN=$(terraform show -no-color tfplan)
        
        delimiter="$(openssl rand -hex 8)"
        echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
        echo "## Terraform Plan Output" >> $GITHUB_OUTPUT
        echo "<details><summary>Click to expand</summary>" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo '```terraform' >> $GITHUB_OUTPUT
        echo "$TERRAFORM_PLAN" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "</details>" >> $GITHUB_OUTPUT
        echo "${delimiter}" >> $GITHUB_OUTPUT
        
    # Publish Terraform Plan as task summary
    #- name: Publish Terraform Plan to Task Summary
    #  env:
    #    SUMMARY: ${{ steps.tf-plan-string.outputs.summary }}
    #  run: echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
      
    # If this is a PR post the changes
    - name: Push Terraform Output to PR
      if: github.event_name == 'pull_request' 
      uses: actions/github-script@v7 
      env: 
        SUMMARY: "${{ steps.tf-plan-string.outputs.summary }}" 
      with: 
        github-token: ${{ secrets.GITHUB_TOKEN }} 
        script: | 
          const body = `${process.env.SUMMARY}`; 
          github.rest.issues.createComment({
            issue_number: context.payload.pull_request.number, 
            owner: context.repo.owner, 
            repo: context.repo.repo, 
            body: body 
          });

    # Remove the runner IP from Key Vault network rules after Terraform completes.
    - name: Remove Runner IP from Key Vault
      if: always()   # ensure we remove the IP even if previous steps fail
      run: |
        KEYVAULT_NAME="${{ steps.env.outputs.kv_name }}"
        RESOURCE_GROUP="${{ steps.env.outputs.resource_group }}"

        if [ -n "$KEYVAULT_NAME" ] && az keyvault show --name "$KEYVAULT_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
          echo "Removing runner IP from Key Vault network rules"
            az keyvault network-rule remove \
              --name "$KEYVAULT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --ip-address "${{ steps.runner-ip.outputs.ip }}"
        else
          echo "Key Vault does not exist yet — nothing to remove"
        fi

  # Checkov IaC security scan job
  checkov-scan:
    name: 'Checkov Security Scan'
    runs-on: ubuntu-latest
    needs: [terraform-plan]   # runs after plan

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: .
        framework: terraform,kubernetes   # scans both .tf files and k8s/ manifests
        output_format: sarif
        output_file_path: checkov-results.sarif
        soft_fail: true   # reports findings but won't block the pipeline — switch to false later

    - name: Upload SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()   # upload results even if Checkov finds issues
      with:
        sarif_file: checkov-results.sarif
  
  terraform-apply:
    name: 'Terraform Apply'
    if: needs.terraform-plan.outputs.tfplanExitCode == '2' && (github.ref_name == 'main' || github.ref_name == 'test')
    runs-on: ubuntu-latest
    environment: ${{ needs.terraform-plan.outputs.environment }}
    needs: [terraform-plan]
    
    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init -backend-config="key=${{ needs.terraform-plan.outputs.tf_state_key }}"

    - name: Azure Login
      uses:  azure/login@v2
      with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'  
    
    - name: Get Runner IP
      id: runner-ip
      run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT
    
    #  Merge runner IP into TF_VAR_allowed_ips BEFORE any apply ──
    # This prevents drift — Terraform owns the runner IP from the start  
    - name: Build Combined Allowed IPs (static + runner)
      run: |
        RUNNER_IP="${{ steps.runner-ip.outputs.ip }}/32"
        STATIC_IPS='${{ vars.ALLOWED_IPS }}'
        COMBINED=$(echo "$STATIC_IPS" | jq -c --arg ip "$RUNNER_IP" '. + [$ip]')
        echo "TF_VAR_allowed_ips=$COMBINED" >> $GITHUB_ENV
        echo "Combined IPs: $COMBINED"

    # Create KV first so whitelist step always has something to target
    - name: Terraform Apply — Key Vault Only
      run: |
        terraform apply \
          -auto-approve \
          -lock-timeout=5m \
          -target=module.key_vault.azurerm_key_vault.key_vault \
          -var "environment=${{ needs.terraform-plan.outputs.environment }}" \
          -var "location=${{ vars.location }}" \
          -var "resource_group_name=${{ needs.terraform-plan.outputs.resource_group }}" 
        
    # Whitelist the GitHub Actions runner IP on the Key Vault network ACL.
    #- name: Whitelist Runner IP on Key Vault
    #  run: |
    #    az keyvault network-rule add \
    #    --name "${{ needs.terraform-plan.outputs.kv_name }}" \
    #    --resource-group "${{ needs.terraform-plan.outputs.resource_group }}" \
    #    --ip-address "${{ steps.runner-ip.outputs.ip }}"

    # Re-plan with this job's runner IP in allowed_ips.
    - name: Terraform Re-Plan with current Runner IP
      run: | 
        terraform plan \
          -lock-timeout=5m \
          -var "environment=${{ needs.terraform-plan.outputs.environment }}" \
          -var "location=${{ vars.location }}" \
          -var "resource_group_name=${{ needs.terraform-plan.outputs.resource_group }}" \
          -no-color -out tfplan_apply
    
    # Terraform Apply
    - name: Terraform Apply
      timeout-minutes: 30
      run: | 
        terraform apply -auto-approve -lock-timeout=10m tfplan_apply

    # Lock down KV — remove runner IP via Terraform to ensure it gets removed even if previous whitelist step was manual or failed for some reason.
    - name: Lock Down Key Vault (Remove Runner IP from ACL)
      if: always()
      env:
        TF_VAR_allowed_ips: ${{ vars.ALLOWED_IPS }}
      run: |
        terraform apply -auto-approve -lock-timeout=5m \
          -target=module.key_vault.azurerm_key_vault.key_vault \
          -var "environment=${{ needs.terraform-plan.outputs.environment }}" \
          -var "location=${{ vars.location }}" \
          -var "resource_group_name=${{ needs.terraform-plan.outputs.resource_group }}"
        echo "KV locked down — runner IP removed from ip_rules"    