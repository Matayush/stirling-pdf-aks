apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf-frontend
  namespace: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf-frontend
  template:
    metadata:
      labels:
        app: stirling-pdf-frontend
    spec:
      containers:
      - name: stirling-pdf-frontend
        image: stirlingtools/stirling-pdf:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: stirling-pdf-frontend-config
        volumeMounts:
        - name: settings-config
          mountPath: /configs/settings.yml
          subPath: settings.yml
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "1000m"
      volumes:
      - name: settings-config
        configMap:
          name: stirling-pdf-frontend-config
          items:
          - key: settings.yml
            path: settings.yml